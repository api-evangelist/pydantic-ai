    DashboardCreateSpec:
      properties:
        display:
          anyOf:
          - $ref: '#/components/schemas/DashboardDisplay'
          - type: 'null'
        datasources:
          additionalProperties:
            $ref: '#/components/schemas/DashboardDatasourceSpec'
          type: object
          title: Datasources
        variables:
          items:
            $ref: '#/components/schemas/DashboardVariable-Input'
          type: array
          title: Variables
        panels:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/DashboardPanel-Input'
            type: object
          - type: 'null'
          title: Panels
        layouts:
          items:
            $ref: '#/components/schemas/DashboardLayout-Input'
          type: array
          title: Layouts
        duration:
          anyOf:
          - type: string
            pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$
