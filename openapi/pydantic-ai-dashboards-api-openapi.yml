          default: false
        plugin:
          $ref: '#/components/schemas/DashboardPlugin'
      type: object
      required:
      - display
      - plugin
      title: DashboardDatasourceSpec
    DashboardCreateRequest:
      properties:
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        definition:
          $ref: '#/components/schemas/DashboardCreate'
